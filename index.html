<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musik-Trinkspiel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>🎵 Musik-Trinkspiel</h1>
    <p id="round-info">Runde 1 – 50s</p>

    <div id="controls">
      <button id="playBtn">▶ Play</button>
      <button id="pauseBtn">⏸️ Pause</button>
      <div id="effect-buttons"></div>
      <div class="card" id="revealCard">❓</div>
    </div>

    <div id="score">
      <p>Punkte: <span id="scoreValue">0</span></p>
      <button id="correctTitleBtn">Titel richtig</button>
      <button id="correctArtistBtn">Interpret richtig</button>
      <button id="wrongBtn">Beides falsch</button>
    </div>
  </div>

  <!-- Songs-Daten laden -->
  <script src="data/songs50s.js"></script>
  <script src="data/songs60s.js"></script>
  <!-- später alle Dekaden hinzufügen -->
  <script src="script.js"></script>
</body>
</html>
