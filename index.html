<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musik-Trinkspiel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- STARTMENÜ (erste Slide) -->
  <section id="startMenu">
    <h1>🎵 Musik-Trinkspiel</h1>
    <p>Namen eingeben und Spieler hinzufügen.</p>

    <div id="playerList">
      <!-- genau EIN Eingabefeld am Anfang -->
      <div class="name-row">
        <input class="nameInput" type="text" placeholder="Spielername">
      </div>
    </div>

    <div class="start-actions">
      <button id="addPlayer">+ Spieler hinzufügen</button>
      <button id="startGame">Spiel starten</button>
    </div>
  </section>

  <!-- DEKADEN-ANIMATION (Overlay) -->
  <section id="decadeOverlay" class="hidden" aria-hidden="true">
    <div id="decadeText">1950er</div>
  </section>

  <!-- HANDOVER / ÜBERGABE-SLIDE (zwischen Zügen) -->
  <section id="handoff" class="hidden">
    <div class="handoff-card">
      <h2 id="handoffTitle">Nächster Spieler</h2>
      <p id="handoffText">Bitte das Handy an … geben</p>
      <button id="handoffContinue">Weiter</button>
    </div>
  </section>

  <!-- SPIEL (wird nach Startmenü sichtbar) -->
  <section id="game" class="hidden">
    <div id="app">
      <div class="toprow">
        <h1>🎵 Musik-Trinkspiel</h1>
        <div class="pillwrap">
          <span class="pill" id="round-info">Runde 1 – 1950er</span>
          <span class="pill" id="turn-info">Dran: —</span>
        </div>
      </div>

      <div id="controls">
        <button id="playBtn">▶ Play</button>
        <button id="pauseBtn">⏸️ Pause</button>
        <div class="card" id="revealCard">❓</div>
      </div>

      <div id="score">
        <p>Punkte (<span id="currentPlayerName">—</span>): <span id="scoreValue">0</span></p>
        <div class="score-btns">
          <button id="correctTitleBtn">Titel richtig (+1)</button>
          <button id="correctArtistBtn">Interpret richtig (+1)</button>
          <button id="wrongBtn" class="secondary">Beides falsch (−2)</button>
        </div>
      </div>

      <div class="nextwrap">
        <button id="nextBtn" class="hidden">Weiter ➜</button>
      </div>
    </div>
  </section>

  <!-- Songs-Daten laden (füge hier alle vorhandenen Dekaden hinzu) -->
  <script src="data/songs50s.js"></script>
  <script src="data/songs60s.js"></script>
  <script src="data/songs70s.js"></script>
  <script src="data/songs80s.js"></script>
  <script src="data/songs90s.js"></script>
  <script src="data/songs00s.js"></script>
  <script src="data/songs10s.js"></script>
  <script src="data/songs20s.js"></script>

  <!-- Spiellogik zuletzt -->
  <script src="script.js"></script>
</body>
</html>
